name: CI

on:
  push:
  pull_request:
    branches: [main]
  workflow_dispatch: # run everything manually: gh workflow run ci.yml

# Cancel superseded runs on the same ref, except on the deploy branches: cancelling a deploy
# halfway could leave migrations applied without the matching frontend.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' && github.ref != 'refs/heads/gp7' }}

permissions:
  contents: read

jobs:
  # Cheap and always runs: a .env commit has no code in it, so a path filter would hide it.
  guard:
    name: No tracked .env files
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v7
      - run: |
          if git ls-files | grep -E '(^|/)\.env($|\.)' | grep -v '\.env\.example$'; then
            echo "::error::A .env file is tracked by git. Remove it and rotate any secrets in it."
            exit 1
          fi

  # Decides which of the jobs below are worth running. Rules are documented in AGENTS.md.
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions:
      contents: read
      pull-requests: read
    outputs:
      check: ${{ github.event_name == 'workflow_dispatch' || steps.filter.outputs.check == 'true' }}
      database: ${{ github.event_name == 'workflow_dispatch' || steps.filter.outputs.database == 'true' }}
      site: ${{ github.event_name == 'workflow_dispatch' || steps.filter.outputs.site == 'true' }}
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@v4.0.3
        id: filter
        if: github.event_name != 'workflow_dispatch'
        with:
          filters: |
            shared: &shared
              - 'package.json'
              - 'package-lock.json'
              - '.nvmrc'
              - 'tsconfig*.json'
              - 'vite.config.ts'
              - '.oxlintrc.json'
              - 'index.html'
              - 'scripts/**'
              - '.github/workflows/**'
            check:
              - *shared
              - 'src/**'
              # The push Edge Function's logic has unit tests.
              - 'supabase/functions/**'
            database:
              - *shared
              - 'src/lib/**'
              - 'supabase/**'
              - 'tests/integration/**'
            # The overview and docs site (site/) is its own npm project.
            site:
              - 'site/**'
              - '.nvmrc'
              - '.github/workflows/**'

  check:
    name: Lint, typecheck, unit tests, build
    needs: changes
    if: needs.changes.outputs.check == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      # Placeholders: some unit tests import the Supabase client, which throws without a URL.
      # Locally these come from the gitignored .env. No network calls are made in this job.
      VITE_SUPABASE_URL: http://127.0.0.1:54321
      VITE_SUPABASE_ANON_KEY: ci-placeholder
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci
      - run: npm run lint
      - run: npm run build # runs tsc -b, then vite build
      - run: npm test # unit tests (vitest, jsdom)
      - run: npm run functions:build # the notify Edge Function's bundle of scripts/notify

  database:
    name: Database and integration tests
    needs: changes
    if: needs.changes.outputs.database == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      # Starts the local Supabase stack in Docker, applies migrations and seed.sql.
      - name: Start local Supabase
        run: npm run db:start

      - name: Database tests (pgTAP, RLS access rules)
        run: npm run test:db

      # Reads the URL and keys from `supabase status`; refuses to run against anything non-local.
      - name: Integration tests
        run: npm run test:integration

      - name: Stop Supabase
        if: always()
        run: npm run db:stop

  # One job for both test suites: the jobs above skip by path, and the number needs unit and
  # integration tests together. Not in deploy's needs, so it can't hold up a deploy.
  # Only this repository publishes a badge, so a ward's own copy skips it.
  coverage:
    name: Test coverage
    needs: changes
    if: >-
      github.repository == 'rhartleyC4/ward-desk' && github.ref == 'refs/heads/main' &&
      (needs.changes.outputs.check == 'true' || needs.changes.outputs.database == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      lines: ${{ steps.summary.outputs.lines }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Start local Supabase
        run: npm run db:start

      # The unit tests import the Supabase client, and the integration tests need the real local key.
      - name: Point the tests at local Supabase
        run: npx supabase status -o json --agent no | jq -r '"VITE_SUPABASE_URL=\(.API_URL)\nVITE_SUPABASE_ANON_KEY=\(.ANON_KEY)"' >> "$GITHUB_ENV"

      # Fails if coverage drops below the thresholds in vite.config.ts.
      - name: Run all tests with coverage
        run: npm run test:coverage

      - name: Read the line coverage
        id: summary
        run: echo "lines=$(jq .total.lines.pct coverage/coverage-summary.json)" >> "$GITHUB_OUTPUT"

      - name: Stop Supabase
        if: always()
        run: npm run db:stop

  # Apart from the job above so the token that can write to the repository never runs npm
  # packages or test code. The badges branch holds only coverage.json, replaced on each run.
  # A push made with this token doesn't start another workflow run.
  coverage-badge:
    name: Publish coverage badge
    needs: coverage
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions:
      contents: write
    env:
      LINE_COVERAGE: ${{ needs.coverage.outputs.lines }}
    steps:
      - uses: actions/checkout@v7

      - run: |
          whole="${LINE_COVERAGE%.*}"
          if [ "$whole" -ge 90 ]; then color=brightgreen
          elif [ "$whole" -ge 75 ]; then color=green
          elif [ "$whole" -ge 60 ]; then color=yellow
          else color=red
          fi
          git checkout --orphan badges
          git rm -rfq .
          jq -n --arg message "$whole%" --arg color "$color" '{schemaVersion: 1, label: "coverage", $message, $color}' > coverage.json
          git add coverage.json
          git -c user.name='github-actions[bot]' -c user.email='41898583+github-actions[bot]@users.noreply.github.com' commit -qm 'chore: update coverage badge'
          git push --force origin badges

  site:
    name: Overview site (check, build)
    needs: changes
    if: needs.changes.outputs.site == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: site/package-lock.json

      - run: npm ci
      - run: npx astro check
      - run: npm run build

  # main deploys to the training site (staging); gp7 deploys to the real one (production).
  # Promote with `git push origin main:gp7`. Setup steps are in README.md under "Deploying".
  # Runs after the checks above pass or are skipped. Off until the DEPLOY_ENABLED repo variable is 'true'.
  # A fork with no training site sets the DEPLOY_STAGING repo variable to 'false' so main doesn't try to deploy one.
  deploy:
    name: Deploy to ${{ github.ref_name == 'gp7' && 'production' || 'staging' }}
    needs: [guard, check, database]
    if: >-
      always() && vars.DEPLOY_ENABLED == 'true' && github.event_name == 'push' &&
      ((github.ref == 'refs/heads/main' && vars.DEPLOY_STAGING != 'false') || github.ref == 'refs/heads/gp7') &&
      needs.guard.result == 'success' &&
      !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: ${{ github.ref_name == 'gp7' && 'production' || 'staging' }}
      url: ${{ github.repository != 'rhartleyC4/ward-desk' && format('https://github.com/{0}/deployments', github.repository) || (github.ref_name == 'gp7' && 'https://gp7.warddesk.app' || 'https://demo.warddesk.app') }}
    concurrency:
      group: deploy-${{ github.ref_name }}
      cancel-in-progress: false
    env:
      # Session pooler connection string for this environment's database. It reaches only that
      # database. Migrations use it; only the function deploy below needs an access token.
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # Production only ever gets commits that already went through staging.
      - name: Check the commit is on main
        if: github.ref_name == 'gp7'
        run: |
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main || {
            echo "::error::production must be a commit from main. Promote with: git push origin main:gp7"
            exit 1
          }

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      # Schema first, so the new frontend never expects a column that isn't there yet.
      # Migrations must therefore keep working with the frontend that is still live.
      - name: Apply database migrations
        run: npx supabase db push --remote="$SUPABASE_DB_URL" --yes

      # Right after the migrations, so the scheduled notify job and the push webhook never run
      # code written for an older schema. The token belongs to a bot account that is a member of
      # the Ward Desk organization only (README, "Deploying"), so it can't reach other projects.
      - name: Deploy Edge Functions
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::warning::SUPABASE_ACCESS_TOKEN isn't set on this environment, so the notify and push functions were not redeployed. Run npm run env:github -- ${{ github.ref_name == 'gp7' && 'production' || 'staging' }}."
            exit 0
          fi
          npm run functions:build
          npx supabase functions deploy notify push --remote="${{ vars.SUPABASE_PROJECT_REF }}" --yes

      - name: Build
        run: npm run build
        env:
          VITE_APP_ENV: ${{ github.ref_name == 'gp7' && 'production' || 'staging' }}
          # The seed's invented-accounts password, for one-tap sign-in on the training site. Empty for production.
          VITE_PRACTICE_PASSWORD: ${{ github.ref_name != 'gp7' && 'gp7' || '' }}
          VITE_SUPABASE_URL: https://${{ vars.SUPABASE_PROJECT_REF }}.supabase.co
          VITE_SUPABASE_ANON_KEY: ${{ vars.SUPABASE_ANON_KEY }}
          VITE_WARD_TIME_ZONE: ${{ vars.WARD_TIME_ZONE }}
          VITE_WARD_NAME: ${{ vars.WARD_NAME }}
          VITE_ENABLE_GOOGLE: ${{ vars.ENABLE_GOOGLE }}
          VITE_VAPID_PUBLIC_KEY: ${{ vars.VAPID_PUBLIC_KEY }}

      - name: Deploy to Cloudflare Pages
        run: npx wrangler pages deploy dist --project-name "${{ vars.CLOUDFLARE_PAGES_PROJECT }}" --branch "${{ github.ref_name }}" --commit-hash "${{ github.sha }}"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}

  # The overview site (warddesk.app). Pushes to main deploy its production (the Pages project's
  # production branch is main); other branches deploy previews. Same DEPLOY_ENABLED switch as above.
  # Only this repository publishes it: a ward's own copy has no ward-desk-site project.
  deploy-site:
    name: Deploy overview site (${{ github.ref_name == 'main' && 'production' || 'preview' }})
    needs: [guard, site]
    if: >-
      always() && github.repository == 'rhartleyC4/ward-desk' &&
      vars.DEPLOY_ENABLED == 'true' && github.event_name == 'push' &&
      github.ref != 'refs/heads/gp7' &&
      needs.guard.result == 'success' && needs.site.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: deploy-site-${{ github.ref_name }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: site/package-lock.json

      - run: npm ci
        working-directory: site
      - run: npm run build
        working-directory: site

      - name: Deploy to Cloudflare Pages
        run: npx wrangler pages deploy site/dist --project-name ward-desk-site --branch "${{ github.ref_name }}" --commit-hash "${{ github.sha }}"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
