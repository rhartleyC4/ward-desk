name: CI

on:
  push:
  pull_request:
    branches: [main]
  workflow_dispatch: # run everything manually: gh workflow run ci.yml

# Cancel superseded runs on the same ref, except on the deploy branches: cancelling a deploy
# halfway could leave migrations applied without the matching frontend.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' && github.ref != 'refs/heads/production' }}

permissions:
  contents: read

jobs:
  # Cheap and always runs: a .env commit has no code in it, so a path filter would hide it.
  guard:
    name: No tracked .env files
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v7
      - run: |
          if git ls-files | grep -E '(^|/)\.env($|\.)' | grep -v '\.env\.example$'; then
            echo "::error::A .env file is tracked by git. Remove it and rotate any secrets in it."
            exit 1
          fi

  # Decides which of the jobs below are worth running. Rules are documented in AGENTS.md.
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions:
      contents: read
      pull-requests: read
    outputs:
      check: ${{ github.event_name == 'workflow_dispatch' || steps.filter.outputs.check == 'true' }}
      database: ${{ github.event_name == 'workflow_dispatch' || steps.filter.outputs.database == 'true' }}
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@v4.0.3
        id: filter
        if: github.event_name != 'workflow_dispatch'
        with:
          filters: |
            shared: &shared
              - 'package.json'
              - 'package-lock.json'
              - '.nvmrc'
              - 'tsconfig*.json'
              - 'vite.config.ts'
              - '.oxlintrc.json'
              - 'index.html'
              - 'scripts/**'
              - '.github/workflows/**'
            check:
              - *shared
              - 'src/**'
            database:
              - *shared
              - 'src/lib/**'
              - 'supabase/**'
              - 'tests/integration/**'

  check:
    name: Lint, typecheck, unit tests, build
    needs: changes
    if: needs.changes.outputs.check == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      # Placeholders: some unit tests import the Supabase client, which throws without a URL.
      # Locally these come from the gitignored .env. No network calls are made in this job.
      VITE_SUPABASE_URL: http://127.0.0.1:54321
      VITE_SUPABASE_ANON_KEY: ci-placeholder
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci
      - run: npm run lint
      - run: npm run build # runs tsc -b, then vite build
      - run: npm test # unit tests (vitest, jsdom)

  database:
    name: Database and integration tests
    needs: changes
    if: needs.changes.outputs.database == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      # Starts the local Supabase stack in Docker, applies migrations and seed.sql.
      - name: Start local Supabase
        run: npm run db:start

      - name: Database tests (pgTAP, RLS access rules)
        run: npm run test:db

      # Reads the URL and keys from `supabase status`; refuses to run against anything non-local.
      - name: Integration tests
        run: npm run test:integration

      - name: Stop Supabase
        if: always()
        run: npm run db:stop

  # main deploys to the training site (staging); production deploys to the real one.
  # Promote with `git push origin main:production`. Setup steps are in README.md under "Deploying".
  # Runs after the checks above pass or are skipped. Off until the DEPLOY_ENABLED repo variable is 'true'.
  deploy:
    name: Deploy to ${{ github.ref_name == 'production' && 'production' || 'staging' }}
    needs: [guard, check, database]
    if: >-
      always() && vars.DEPLOY_ENABLED == 'true' && github.event_name == 'push' &&
      (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/production') &&
      needs.guard.result == 'success' &&
      !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: ${{ github.ref_name == 'production' && 'production' || 'staging' }}
      url: ${{ github.ref_name == 'production' && 'https://gp7.warddesk.app' || 'https://gp7-training.warddesk.app' }}
    concurrency:
      group: deploy-${{ github.ref_name }}
      cancel-in-progress: false
    env:
      # Session pooler connection string for this environment's database. It reaches only that
      # database, unlike a Supabase access token, which can manage every project you own.
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # Production only ever gets commits that already went through staging.
      - name: Check the commit is on main
        if: github.ref_name == 'production'
        run: |
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main || {
            echo "::error::production must be a commit from main. Promote with: git push origin main:production"
            exit 1
          }

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      # Schema first, so the new frontend never expects a column that isn't there yet.
      # Migrations must therefore keep working with the frontend that is still live.
      - name: Apply database migrations
        run: npx supabase db push --db-url "$SUPABASE_DB_URL" --yes

      - name: Build
        run: npm run build
        env:
          VITE_APP_ENV: ${{ github.ref_name == 'production' && 'production' || 'staging' }}
          VITE_SUPABASE_URL: https://${{ vars.SUPABASE_PROJECT_REF }}.supabase.co
          VITE_SUPABASE_ANON_KEY: ${{ vars.SUPABASE_ANON_KEY }}
          VITE_WARD_TIME_ZONE: ${{ vars.WARD_TIME_ZONE }}
          VITE_ENABLE_GOOGLE: ${{ vars.ENABLE_GOOGLE }}
          VITE_VAPID_PUBLIC_KEY: ${{ vars.VAPID_PUBLIC_KEY }}

      - name: Deploy to Cloudflare Pages
        run: npx wrangler pages deploy dist --project-name "${{ vars.CLOUDFLARE_PAGES_PROJECT }}" --branch "${{ github.ref_name }}" --commit-hash "${{ github.sha }}"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
