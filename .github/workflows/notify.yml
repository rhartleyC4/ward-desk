name: Day-ahead summaries

# Each evening, sends bishopric members tomorrow's summary as a push notification (scripts/notify).
# Scheduled runs happen on main: they send for staging, then start this workflow on the production
# branch, so each site is served by the code deployed to it and the production environment stays
# limited to the production branch. Runs fire hourly through the evening (UTC) and the script only
# sends between 6 and 10 PM ward time, once per person per day, so GitHub's late starts and daylight
# saving don't matter. Off until the NOTIFY_ENABLED repo variable is 'true'.
#
# Test by hand: Actions → Day-ahead summaries → Run workflow, on main (staging) or production.

on:
  schedule:
    - cron: '7 0-4 * * *'
  workflow_dispatch:
    inputs:
      date:
        description: Day to summarize (YYYY-MM-DD). Blank for tomorrow.
        required: false
      only:
        description: Send only to this email (blank for everyone).
        required: false
      dry_run:
        description: Show the summaries without sending
        type: boolean
        default: true
      force:
        description: Send even if already sent for that day
        type: boolean
        default: false
      scheduled:
        description: Only send in the evening window (how the nightly production run is started)
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: notify-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  send:
    name: Send for ${{ github.ref_name == 'production' && 'production' || 'staging' }}
    if: vars.NOTIFY_ENABLED == 'true' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/production')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: ${{ github.ref_name == 'production' && 'production' || 'staging' }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Send summaries
        run: |
          set --
          [ "$SCHEDULED" = "true" ] && set -- --scheduled
          [ -n "$DATE" ] && set -- "$@" --date "$DATE"
          [ -n "$ONLY" ] && set -- "$@" --only "$ONLY"
          [ "$DRY_RUN" = "true" ] && set -- "$@" --dry-run
          [ "$FORCE" = "true" ] && set -- "$@" --force
          npm run notify -- "$@"
        env:
          SCHEDULED: ${{ github.event_name == 'schedule' || inputs.scheduled }}
          DATE: ${{ inputs.date }}
          ONLY: ${{ inputs.only }}
          DRY_RUN: ${{ inputs.dry_run }}
          FORCE: ${{ inputs.force }}
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          WARD_TIME_ZONE: ${{ vars.WARD_TIME_ZONE }}
          VAPID_PUBLIC_KEY: ${{ vars.VAPID_PUBLIC_KEY }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          VAPID_SUBJECT: ${{ vars.VAPID_SUBJECT }}

  production:
    name: Start the production run
    if: vars.NOTIFY_ENABLED == 'true' && github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions:
      actions: write
      contents: read
    steps:
      # The production branch only has this workflow once it has been promoted there.
      - run: |
          if gh api "repos/$GITHUB_REPOSITORY/contents/.github/workflows/notify.yml?ref=production" --silent 2>/dev/null; then
            gh workflow run notify.yml --repo "$GITHUB_REPOSITORY" --ref production -f dry_run=false -f scheduled=true
          else
            echo "Not on the production branch yet; nothing to start."
          fi
        env:
          GH_TOKEN: ${{ github.token }}
