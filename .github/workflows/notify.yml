name: Day-ahead summaries

# Sends notifications by hand (scripts/notify). The scheduled sending happens in Supabase: pg_cron
# calls the notify Edge Function every 10 minutes (see "Notifications" in README.md). Use this to
# try a summary or see what's due without waiting: run it on main for staging or on production.
# Off until the NOTIFY_ENABLED repo variable is 'true'.

on:
  workflow_dispatch:
    inputs:
      date:
        description: Day to summarize (YYYY-MM-DD). Blank for tomorrow.
        required: false
      only:
        description: Send only to this email (blank for everyone).
        required: false
      dry_run:
        description: Show the summaries without sending
        type: boolean
        default: true
      force:
        description: Send even if already sent for that day
        type: boolean
        default: false
      tick:
        description: Instead of one day's summaries, send everything due right now, as the Edge Function would
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: notify-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  send:
    name: Send for ${{ github.ref_name == 'production' && 'production' || 'staging' }}
    if: vars.NOTIFY_ENABLED == 'true' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/production')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: ${{ github.ref_name == 'production' && 'production' || 'staging' }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Send summaries
        run: |
          set --
          [ "$TICK" = "true" ] && set -- --tick
          [ -n "$DATE" ] && set -- "$@" --date "$DATE"
          [ -n "$ONLY" ] && set -- "$@" --only "$ONLY"
          [ "$DRY_RUN" = "true" ] && set -- "$@" --dry-run
          [ "$FORCE" = "true" ] && set -- "$@" --force
          npm run notify -- "$@"
        env:
          TICK: ${{ inputs.tick }}
          DATE: ${{ inputs.date }}
          ONLY: ${{ inputs.only }}
          DRY_RUN: ${{ inputs.dry_run }}
          FORCE: ${{ inputs.force }}
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          WARD_TIME_ZONE: ${{ vars.WARD_TIME_ZONE }}
          VAPID_PUBLIC_KEY: ${{ vars.VAPID_PUBLIC_KEY }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          VAPID_SUBJECT: ${{ vars.VAPID_SUBJECT }}
